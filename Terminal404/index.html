<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="404 – Page Not Found">
    <meta name="keywords" content="404, Page Not Found">
    <meta name="color-scheme" content="dark">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        mono: ['"IBM Plex Mono"', 'monospace'],
                    },
                    keyframes: {
                        blink: {
                            '0%, 49%': {opacity: 1},
                            '50%, 100%': {opacity: 0},
                        },
                        typeCmd: {
                            from: {width: '0'},
                            to: {width: '15ch'},
                        },
                        rise: {
                            from: {opacity: 0, transform: 'translateY(16px)'},
                            to: {opacity: 1, transform: 'translateY(0)'},
                        },
                    },
                    animation: {
                        blink: 'blink 1s step-end infinite',
                        typeCmd: 'typeCmd 1.1s steps(15) forwards',
                        rise: 'rise 0.5s ease both',
                    },
                },
            },
        };
    </script>
    <title>404 – Page Not Found</title>
</head>
<body class="min-h-dvh flex items-center justify-center px-4 py-10 bg-zinc-950 text-zinc-200 font-sans">

<main class="w-full max-w-xl animate-rise">

    <div class="rounded-xl border border-white/10 bg-zinc-900/70 shadow-2xl shadow-black/40 overflow-hidden backdrop-blur">

        <div class="flex items-center gap-2 px-4 py-3 border-b border-white/10 bg-white/[0.03]">
            <span class="w-3 h-3 rounded-full bg-red-500/80"></span>
            <span class="w-3 h-3 rounded-full bg-amber-500/80"></span>
            <span class="w-3 h-3 rounded-full bg-emerald-500/80"></span>
            <span class="ml-3 text-xs text-zinc-500 font-mono">~/session — 404</span>
        </div>

        <div class="px-5 py-6 sm:px-7 sm:py-8 font-mono text-sm sm:text-base leading-relaxed">
            <p class="text-zinc-500">
                <span class="text-emerald-400">visitor@site</span><span class="text-zinc-600">:</span><span class="text-sky-400">~</span><span class="text-zinc-600">$</span>
                <span class="inline-block overflow-hidden whitespace-nowrap align-bottom animate-typeCmd">open ./this-page</span>
            </p>

            <p class="mt-3 text-red-400">zsh: no such file or directory: ./this-page</p>

            <p class="mt-5 text-3xl sm:text-4xl font-semibold text-zinc-100">
                Error 404
            </p>
            <p class="mt-2 text-zinc-400">
                The page you asked for isn't on this server — wrong turn, old link, or it never existed.
            </p>

            <p class="mt-6 text-zinc-500">
                <span class="text-emerald-400">visitor@site</span><span class="text-zinc-600">:</span><span class="text-sky-400">~</span><span class="text-zinc-600">$</span>
                <span class="ml-1 inline-block w-2 h-4 align-middle bg-emerald-400 animate-blink"></span>
            </p>
        </div>

        <div class="flex flex-col sm:flex-row border-t border-white/10">
            <a href="/"
               class="flex-1 px-5 py-3.5 font-mono text-sm text-center text-emerald-300
                      hover:bg-emerald-400/10 transition border-b sm:border-b-0 sm:border-r border-white/10">
                <span class="text-zinc-600">❯</span> cd ~
            </a>
            <button type="button" onclick="history.back()"
                    class="flex-1 px-5 py-3.5 font-mono text-sm text-center text-zinc-400
                           hover:bg-white/5 hover:text-zinc-200 transition">
                <span class="text-zinc-600">❯</span> cd -
            </button>
        </div>

    </div>

    <p class="mt-4 text-center font-mono text-xs text-zinc-700">exit code 404</p>
</main>

</body>
</html>
